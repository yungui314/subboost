name: Build region fallback image

on:
  push:
    branches: [aethersailor-region-fallback]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Test proxy group generator
        run: npx vitest run packages/core/src/generator/proxy-groups.test.ts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: local/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/subboost-aethersailor:v2.6.0-region-fallback
            ghcr.io/${{ github.repository_owner }}/subboost-aethersailor:latest
          build-args: |
            APP_RELEASE_VERSION=2.6.0-region-fallback
            APP_VERSION=2.6.0
            APP_VERSION_TOKEN=region-fallback
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image archive
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/subboost-aethersailor:v2.6.0-region-fallback
          docker save ghcr.io/${{ github.repository_owner }}/subboost-aethersailor:v2.6.0-region-fallback \
            | gzip -1 > subboost-v2.6.0-region-fallback.tar.gz

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: subboost-v2.6.0-region-fallback-image
          path: subboost-v2.6.0-region-fallback.tar.gz
          retention-days: 3
          compression-level: 0
